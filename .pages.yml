# Pages CMS 設定ファイル
# https://pagescms.org/docs/configuration
#
# メニューは「サービス一覧 / ブログ / お問い合わせ」の3グループ構成。
# グループ（type: group）は表示上のまとまりを作るだけで、データの場所は変わらない。

# メディア（画像）の設定
media:
  input: images
  output: images

# 編集できる項目（3グループ）
content:

  # 【1】サービス一覧ページ（service.html が読み込む内容）
  - name: page_service
    label: サービス一覧ページ
    type: group
    items:
      - name: settings
        label: 基本情報
        type: file
        path: content/settings.json
        format: json
        fields:
          - name: phone
            label: 電話番号
            type: string
          - name: address
            label: 住所
            type: text
          - name: business_hours
            label: 営業時間
            type: string

      - name: hero
        label: ヒーロー（トップ画面）
        type: file
        path: content/hero.json
        format: json
        fields:
          - name: status_badge
            label: ステータスバッジ（上部の緑丸アイコン横）
            type: string
          - name: catchphrase
            label: メインキャッチコピー
            type: object
            fields:
              - name: part1
                label: 強調1（青色）
                type: string
              - name: part2
                label: 中間1
                type: string
              - name: part3
                label: 強調2（青色）
                type: string
              - name: part4
                label: 中間2
                type: string
              - name: part5
                label: 末尾（青下線付き）
                type: string
          - name: area_label_line1
            label: 拠点テキスト 1行目
            type: string
          - name: area_label_line2
            label: 拠点テキスト 2行目
            type: string
          - name: achievement_1
            label: 実績バッジ 1（青色）
            type: object
            fields:
              - name: number
                label: 数字
                type: string
              - name: unit
                label: 単位
                type: string
              - name: label
                label: 説明
                type: text
          - name: achievement_2
            label: 実績バッジ 2（青色）
            type: object
            fields:
              - name: number
                label: 数字
                type: string
              - name: unit
                label: 単位
                type: string
              - name: label
                label: 説明
                type: text
          - name: achievement_3
            label: 実績バッジ 3（オレンジ色・★付き）
            type: object
            fields:
              - name: number
                label: 数字
                type: string
              - name: label
                label: 説明
                type: text
          - name: achievement_4
            label: 実績バッジ 4（オレンジ色）
            type: object
            fields:
              - name: number
                label: 数字
                type: string
              - name: unit
                label: 単位
                type: string
              - name: label
                label: 説明
                type: text
          - name: subtitle
            label: サブタイトル（実績バッジの下の説明文）
            type: text
          - name: discount
            label: 割引バッジ
            type: object
            fields:
              - name: text_before
                label: 文言（前）
                type: string
              - name: price
                label: 割引額
                type: string
              - name: text_after
                label: 文言（後）
                type: string
              - name: notes
                label: 注記
                type: string

      # サービスごと（カード＋詳細）。サービス名を押すと、カードの枠と詳細画面の中身が1画面に出る
      - name: service_details
        label: サービス（カード・詳細）
        type: group
        items:
          - name: modal_aircon
            label: エアコンクリーニング
            type: file
            path: content/modals/aircon.json
            format: json
            fields:
              - name: card
                label: カード（サービス一覧に並ぶ枠）
                type: object
                fields:
                  - {name: image, label: カード画像, type: image}
                  - {name: title, label: タイトル, type: string}
                  - {name: description, label: 説明文, type: text}
                  - {name: price, label: 価格表示, type: string}
                  - {name: order, label: 表示順（1が一番前・2、3…の順に並びます。入れ替える時は番号を付け替えてください。空なら一番後ろ）, type: number}
              - {name: title, label: 詳細画面の見出し, type: string}
              - {name: badge_1_line1, label: バッジ1上段（全機種対応）, type: string}
              - {name: badge_2_line1, label: バッジ2上段, type: string}
              - {name: badge_2_line2, label: バッジ2下段（強調）, type: string}
              - {name: badge_3_line1, label: バッジ3上段（保険加入済み）, type: string}
              - {name: concerns_title, label: お悩みリスト 見出し, type: string}
              - name: concerns_list
                label: お悩みリスト 項目
                type: string
                list: true
              - {name: concerns_outro, label: お悩みリスト 締めの一文, type: string}
              - {name: price_section_title, label: 価格表 見出し, type: string}
              - {name: price_section_note, label: 価格表 注記, type: string}
              - {name: price_group_1_name, label: 価格表 グループ1名（家庭用）, type: string}
              - name: price_group_1_items
                label: 価格表 グループ1 項目
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{index}. {fields.name}"
                fields:
                  - {name: name, label: 項目名, type: string}
                  - {name: price, label: 価格, type: string}
              - {name: price_group_1_note, label: 価格表 グループ1 注記, type: string}
              - {name: price_group_2_name, label: 価格表 グループ2名（業務用）, type: string}
              - name: price_group_2_items
                label: 価格表 グループ2 項目
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{index}. {fields.name}"
                fields:
                  - {name: name, label: 項目名, type: string}
                  - {name: price, label: 価格, type: string}
              - {name: options_title, label: オプション 見出し, type: string}
              - name: options_list
                label: オプション 項目
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{index}. {fields.name}"
                fields:
                  - {name: name, label: 項目名, type: string}
                  - {name: price, label: 価格, type: string}
              - {name: points_title, label: キレイシアのポイント 見出し, type: string}
              - {name: points_intro, label: キレイシアのポイント リード文, type: string}
              - name: points_list
                label: キレイシアのポイント 項目
                type: string
                list: true
              - {name: before_after_title, label: Before/After 見出し, type: string}
              - name: before_after_slides
                label: Before/After スライド（追加・削除可）
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{index}. {fields.caption}"
                fields:
                  - {name: caption, label: キャプション, type: string}
                  - {name: before_image, label: Before画像, type: image}
                  - {name: before_alt, label: Before画像の説明（SEO用）, type: string}
                  - {name: after_image, label: After画像, type: image}
                  - {name: after_alt, label: After画像の説明（SEO用）, type: string}
              - {name: customer_request_title, label: お客様へお願い 見出し, type: string}
              - name: customer_request_list
                label: お客様へお願い 項目
                type: string
                list: true
              - {name: booking_notes_title, label: 予約注意事項 見出し, type: string}
              - name: booking_notes_list
                label: 予約注意事項 項目
                type: string
