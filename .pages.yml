  # 【2】ブログ
  - name: page_blog
    label: ブログ
    type: group
    items:
      - name: blog
        label: お役立ちブログ（記事）
        type: collection
        path: content/blog
        format: yaml-frontmatter
        # 新規記事のファイル名は slug（半角英数字）から作る
        filename: '{fields.slug}.md'
        # 一覧画面に表示する項目と、並び順（公開日の新しい順）
        view:
          fields: [title, category, date, published]
          primary: title
          sort: [date]
          default:
            sort: date
            order: desc
        fields:
          - name: title
            label: 記事タイトル
            type: string
          - name: slug
            label: ファイル名（slug）
            type: string
            description: 半角英数字とハイフンのみ。例 aircon-price-osaka （日本語・スペースは使わない）
          - name: type
            label: 記事タイプ
            type: select
            options:
              values:
                - { value: article, label: お役立ち記事 }
                - { value: case, label: 施工事例 }
            default: article
          - name: category
            label: カテゴリ
            type: select
            options:
              values: [エアコン, 浴室・水回り, キッチン, 料金・相場, 施工事例, お知らせ]
            default: 料金・相場
          - name: date
            label: 公開日
            type: date
          - name: thumbnail
            label: サムネイル画像（一覧に表示）
            type: image
          - name: description
            label: 検索用の説明文（meta description）
            type: text
            description: 検索結果やSNSに表示される説明。70〜120字目安。
          - name: lead
            label: 冒頭の結論文（リード）
            type: text
            description: 記事の最初に表示する「結論」の一文。
          # ---- ここから下は 記事タイプ=施工事例(case) のときだけ入力 ----
          - name: place
            label: 施工事例(case)のとき入力｜場所
            type: string
          - name: work
            label: 施工事例(case)のとき入力｜作業内容
            type: string
          - name: scale
            label: 施工事例(case)のとき入力｜台数・規模
            type: string
          - name: days
            label: 施工事例(case)のとき入力｜所要日数
            type: string
          # ---- 公開設定 ----
          - name: published
            label: 公開する
            type: boolean
            default: false
            description: ONにすると次回ビルドでサイトに公開されます。
          # ---- 本文 ----
          - name: body
            label: 本文
            type: rich-text

