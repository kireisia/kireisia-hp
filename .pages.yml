            type: object
            fields:
              - {name: image, label: カード画像, type: image}
              - {name: title, label: タイトル, type: string}
              - {name: description, label: 説明文, type: text}
              - {name: price, label: 価格表示, type: string}
          - name: aircon_install
            label: エアコン設置
            type: object
            fields:
              - {name: image, label: カード画像, type: image}
              - {name: title, label: タイトル, type: string}
              - {name: description, label: 説明文, type: text}
              - {name: price, label: 価格表示, type: string}
          - name: shop
            label: 店舗清掃
            type: object
            fields:
              - {name: image, label: カード画像, type: image}
              - {name: title, label: タイトル, type: string}
              - {name: description, label: 説明文, type: text}
              - {name: price, label: 価格表示, type: string}
          - name: handyman
            label: 便利屋
            type: object
            fields:
              - {name: image, label: カード画像, type: image}
              - {name: title, label: タイトル, type: string}
              - {name: description, label: 説明文, type: text}
              - {name: price, label: 価格表示, type: string}
          - name: drain
            label: 排水管洗浄
