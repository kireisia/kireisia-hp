  # 【2】ブログ
  - name: page_blog
    label: ブログ
    type: group
    items:
      - name: blog
        label: お役立ちブログ（記事）
        type: collection
        path: content/blog
        format: yaml-frontmatter
        # 新規記事のファイル名は slug（半角英数字）から作る
        filename: '{fields.slug}.md'
        # 一覧画面に表示する項目と、並び順（公開日の新しい順）
        view:
          fields: [title, category, date, published]
          primary: title
          sort: [date]
          default:
            sort: date
            order: desc
        fields:
          - name: title
            label: 記事タイトル
            type: string
            description: 【必須】記事ページの見出しと、Google検索結果のタイトルになります。読む人の悩みが伝わる言葉で（例 エアコンクリーニングの料金相場は？）。
          - name: slug
            label: ファイル名（slug）
            type: string
            # 半角小文字・数字・ハイフン以外（空白・日本語・大文字）は保存前にCMSが止める
            pattern:
              regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
              message: 半角の小文字・数字・ハイフンだけで入力してください（空白・日本語・大文字は使えません）。
            description: 記事ページのURLの最後の部分になります（例 aircon-price-osaka → https://www.kireisia.co.jp/blog/aircon-price-osaka.html）。半角英数字とハイフンのみ（日本語・スペースは使わない）。公開後に変えるとURLが変わり、SNS等に貼ったリンクが開けなくなります。
          - name: type
            label: 記事タイプ
            type: select
            options:
              values:
                - { value: article, label: お役立ち記事 }
                - { value: case, label: 施工事例 }
            default: article
            description: お役立ち記事＝掃除のコツや料金の解説。施工事例＝実際の作業の紹介（下の「施工事例のとき入力」欄が「施工概要」の表として表示されます）。
          # カテゴリは「ブログ → カテゴリ」で登録したものから選ぶ（保存されるのはカテゴリ名）
          - name: category
            label: カテゴリ
            type: reference
            description: 【必須】ブログ一覧の絞り込みボタンで、この記事が入るグループです。選択肢を増やす時は、左メニュー「ブログ → カテゴリ」で追加してください。
            options:
              collection: blog_categories
              # {name} はPages CMSでは「ファイル名」の意味になるため、必ず {fields.name} と書く
              value: "{fields.name}"
              label: "{fields.name}"
              search: fields.name
          - name: date
            label: 公開日
            type: date
            description: 【必須】記事に「◯年◯月◯日 更新」と表示され、ブログ一覧はこの日付の新しい順に並びます。
          - name: thumbnail
            label: サムネイル画像（一覧に表示）
            type: image
            description: ブログ一覧のカードに表示される画像です。空欄の場合はロゴ画像が表示されます。
          - name: description
            label: 検索用の説明文（meta description）
            type: text
            description: 【必須】Google検索結果やSNSで、タイトルの下に出る紹介文です（記事ページには表示されません）。70〜120字目安。空欄だと記事が公開されません。
          - name: lead
            label: 冒頭の結論文（リード）
            type: text
            description: 【必須】記事の一番上の青い枠に出る「この記事の答え」です。本文の書き出しと同じ文にせず、結論だけを1〜2文で（例 料金は機種で変わります。お掃除機能付きは追加料金がかかる場合があります）。ブログ一覧のカードの紹介文にも使われます。
          # ---- ここから下は 記事タイプ=施工事例(case) のときだけ入力 ----
          - name: place
            label: 施工事例(case)のとき入力｜場所
            type: string
            description: 「施工概要」の表に表示されます（例 大阪市城東区のマンション）。お役立ち記事では空欄のままでOK。
          - name: work
            label: 施工事例(case)のとき入力｜作業内容
            type: string
            description: 例 エアコン分解洗浄
          - name: scale
            label: 施工事例(case)のとき入力｜台数・規模
            type: string
            description: 例 壁掛けエアコン3台
          - name: days
            label: 施工事例(case)のとき入力｜所要日数
            type: string
            description: 例 1日
          # ---- 公開設定 ----
          - name: published
            label: 公開する
            type: boolean
            default: false
            description: ONで公開、OFFのままなら下書き（サイトに出ません）。※【必須】の欄が1つでも空だと、ONでも公開されません。
          # ---- 本文 ----
          - name: body
            label: 本文
            type: rich-text
            description: 記事の本文です。見出しを使うと、記事の上に目次が自動でできます。

      # ブログのカテゴリ（一覧ページの絞り込みボタン＋記事のカテゴリ選択肢になる）
      - name: blog_categories
        label: カテゴリ
        type: collection
        path: content/blog-categories
        format: json
        # ファイル名は作成日時から自動で作る（日本語名でも壊れないように）
        filename: 'category-{year}{month}{day}-{hour}{minute}{second}.json'
        view:
          fields: [name, order]
          primary: name
          default:
            sort: order
            order: asc
        fields:
          - name: name
            label: カテゴリ名
            type: string
            required: true
            description: ブログ一覧のボタンに表示される名前。記事が0本でもボタンは表示されます（押すと「このジャンルの記事はまだありません。」と出ます）。
          - name: order
            label: 並び順
            type: number
            description: 小さい数字ほど左に表示されます（例 1, 2, 3）。

  # 【3】お問い合わせ
  - name: page_contact
    label: お問い合わせ
    type: group
    items:
      - name: contact
        label: お問い合わせページ
        type: file
        path: content/contact.json
        format: json
        fields:
          - name: page_subtitle
            label: ページ上部のサブ文
            type: string
          - name: form_subtitle_line1
            label: フォーム案内文（1行目）
            type: string
          - name: form_subtitle_line2
            label: フォーム案内文（2行目）
            type: string

      # ------------------------------------------------------------
      # フォームの入力項目
      #   ここを編集すると、お問い合わせフォームの入力欄が変わる。
      #   「項目名」がそのまま通知メールの見出しになる（SSGformは事前登録不要）。
      #   ※「メールアドレス」と「内容」は消しても自動で復活する（返信できなくなるのを防ぐため）
      # ------------------------------------------------------------
      - name: form_fields
        label: フォームの入力項目
        type: file
        path: content/form.json
        format: json
        fields:
          - name: form_items
            label: 入力項目（上から順に、フォームに表示されます）
            type: object
            # 各項目は折りたたんで表示し、見出しに「番号. 項目名（入力のしかた）」を出す。
            # 全部開いた状態だと縦に長くなり、フォームとの対応が分からなくなるため。
            list:
              collapsible:
                collapsed: true
                summary: "{index}. {fields.item_label}"
            fields:
              - name: item_label
                label: 項目名
                type: string
                description: そのまま画面に表示され、通知メールの見出しにもなります。例）お名前・ご希望日
              - name: input_type
                label: 入力のしかた
                type: select
                default: text
                options:
                  values:
                    - { value: text, label: 1行の文字入力 }
                    - { value: email, label: メールアドレス }
                    - { value: tel, label: 電話番号 }
                    - { value: textarea, label: 複数行の文字入力 }
                    - { value: radio, label: 選択肢から1つだけ選ぶ }
                    - { value: checkbox, label: 選択肢から複数選べる }
              - name: is_required
                label: 入力を必須にする
                type: boolean
                default: false
              - name: choices
                label: 選択肢（「選ぶ」タイプのときだけ入力）
                type: string
                list: true
                description: 上から順に表示されます。例）あり／なし
              - name: placeholder
                label: 入力欄の薄い見本文字（任意）
                type: string
                description: 入力欄に薄く表示される記入例。例）山田 太郎
              - name: help
                label: 補足説明（任意）
                type: text
                description: 入力欄の下に小さく表示される案内文
              - name: half
                label: 横に2つ並べる（隣の項目とセットで有効）
                type: boolean
                default: false
                description: 「姓」と「名」のように短い項目を横並びにしたいときにON

