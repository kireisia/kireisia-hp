              - {name: image, label: カード画像, type: image}
              - {name: title, label: タイトル, type: string}
              - {name: description, label: 説明文, type: text}
              - {name: price, label: 価格表示, type: string}
          - name: housekeeping
            label: 家事代行
            type: object
            fields:
              - {name: image, label: カード画像, type: image}
              - {name: title, label: タイトル, type: string}
              - {name: description, label: 説明文, type: text}
              - {name: price, label: 価格表示, type: string}

      # サービスごとの詳細（料金表・FAQ・Before/After）
      - name: service_details
        label: サービスの詳細（料金表）
        type: group
        items:
          - name: modal_aircon
            label: 詳細：エアコンクリーニング
            type: file
            path: content/modals/aircon.json
            format: json
            fields:
              - {name: title, label: モーダルタイトル, type: string}
              - {name: badge_1_line1, label: バッジ1上段（全機種対応）, type: string}
              - {name: badge_2_line1, label: バッジ2上段, type: string}
              - {name: badge_2_line2, label: バッジ2下段（強調）, type: string}
              - {name: badge_3_line1, label: バッジ3上段（保険加入済み）, type: string}
              - {name: concerns_title, label: お悩みリスト 見出し, type: string}
              - name: concerns_list
                label: お悩みリスト 項目
                type: string
                list: true
              - {name: concerns_outro, label: お悩みリスト 締めの一文, type: string}
              - {name: price_section_title, label: 価格表 見出し, type: string}
              - {name: price_section_note, label: 価格表 注記, type: string}
              - {name: price_group_1_name, label: 価格表 グループ1名（家庭用）, type: string}
              - name: price_group_1_items
                label: 価格表 グループ1 項目
                type: object
                list: true
                fields:
                  - {name: name, label: 項目名, type: string}
                  - {name: price, label: 価格, type: string}
              - {name: price_group_1_note, label: 価格表 グループ1 注記, type: string}
              - {name: price_group_2_name, label: 価格表 グループ2名（業務用）, type: string}
              - name: price_group_2_items
                label: 価格表 グループ2 項目
                type: object
                list: true
                fields:
                  - {name: name, label: 項目名, type: string}
                  - {name: price, label: 価格, type: string}
              - {name: options_title, label: オプション 見出し, type: string}
              - name: options_list
                label: オプション 項目
                type: object
                list: true
                fields:
                  - {name: name, label: 項目名, type: string}
                  - {name: price, label: 価格, type: string}
              - {name: points_title, label: キレイシアのポイント 見出し, type: string}
