              - {name: cancellation_title, label: キャンセル料金 見出し, type: string}
              - name: cancellation_list
                label: キャンセル料金 項目
                type: object
                list: true
                fields:
                  - {name: period, label: 期間, type: string}
                  - {name: rate, label: 料率, type: string}
                  - name: color
                    label: 強調色
                    type: select
                    options: {values: [main, warm, red]}
              - {name: cancellation_note, label: キャンセル料金 注記, type: string}
              - {name: seo_title, label: SEOテキスト タイトル, type: string}
              - {name: seo_paragraph_1, label: SEOテキスト 段落1, type: text}
              - {name: seo_paragraph_2, label: SEOテキスト 段落2, type: text}

